services:
  # 1. Python FastAPI Microservice
  - type: web
    name: resume-ai-python-service
    env: python
    rootDir: ai-service-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_NAME
        value: claude-3-5-sonnet-20241022

  # 2. Node.js Express Gateway
  - type: web
    name: resume-ai-backend-node
    env: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: resume-ai-python-service
          property: hostport

  # 3. Frontend React App
  - type: web
    name: resume-ai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: resume-ai-backend-node
          property: url
        suffix: /api
